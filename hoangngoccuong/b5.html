
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Doan so may man</title>
</head>
<body>
<h2>Doan so may man</h2>

<label>Nhap so tu 1 den 10:</label>
<input type="number" id="so">
<br><br>

<button onclick="xemBoi()">Xem ket qua</button>

<h3 id="ketqua"></h3>

<script>
function xemBoi() {
let so = document.getElementById("so").value;
let mayMan = Math.floor(Math.random() * 10) + 1;

if (so == "" || so < 1 || so > 10) {
document.getElementById("ketqua").innerHTML =
"Vui long nhap so tu 1 den 10!";
} else if (so == mayMan) {
document.getElementById("ketqua").innerHTML =
"Chuc mung! Ban da thang. So may man la: " + mayMan;
} else {
document.getElementById("ketqua").innerHTML =
"Ban chua may man! So may man la: " + mayMan;
}
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<title>Xuc xac may man</title>

<h2>Xuc xac may man</h2>

<button onclick="lacXucXac()">Lac xuc xac</button>

<h3 id="ketqua"></h3>

function lacXucXac() {

document.getElementById("ketqua").innerHTML =
"Ket qua xuc xac: " + diem;
}
</script>

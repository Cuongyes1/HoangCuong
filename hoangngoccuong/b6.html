!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Da Giay Keo</title>
</head>
<body>
<h2>Tro choi Da - Giay - Keo</h2>

<button onclick="choi('Da')">Da</button>
<button onclick="choi('Giay')">Giay</button>
<button onclick="choi('Keo')">Keo</button>

<h3 id="ketqua"></h3>

<script>
function choi(nguoiChoi) {
let luaChon = ["Da", "Giay", "Keo"];
let mayChoi = luaChon[Math.floor(Math.random() * 3)];

let ketQua = "";

if (nguoiChoi == mayChoi) {
ketQua = "Hoa!";
} else if (
(nguoiChoi == "Da" && mayChoi == "Keo") ||
(nguoiChoi == "Giay" && mayChoi == "Da") ||
(nguoiChoi == "Keo" && mayChoi == "Giay")
) {
ketQua = "Ban thang!";
} else {
ketQua = "Ban thua!";
}

document.getElementById("ketqua").innerHTML =
"Ban chon: " + nguoiChoi +
"<br>May chon: " + mayChoi +
"<br>Ket qua: " + ketQua;
}
</script>
</body>
</html>

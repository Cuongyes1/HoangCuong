<!DOCTYPE html>
<html>
<head>
    <title>Máy tính đơn giản</title>
</head>
<body>
    <h2>Máy tính đơn giản</h2>

    Nhập số thứ nhất:
    <input type="number" id="so1"><br><br>

    Nhập số thứ hai:
    <input type="number" id="so2"><br><br>

    <button onclick="tinh('+')">Cộng</button>
    <button onclick="tinh('-')">Trừ</button>
    <button onclick="tinh('*')">Nhân</button>
    <button onclick="tinh('/')">Chia</button>

    <p id="ketqua"></p>

    <script>
        function tinh(phepTinh) {
            var a = Number(document.getElementById("so1").value);
            var b = Number(document.getElementById("so2").value);
            var kq;

            if (phepTinh == '+')
                kq = a + b;
            else if (phepTinh == '-')
                kq = a - b;
            else if (phepTinh == '*')
                kq = a * b;
            else if (phepTinh == '/') {
                if (b == 0) {
                    document.getElementById("ketqua").innerHTML = "Không thể chia cho 0!";
                    return;
                }
                kq = a / b;
            }

            document.getElementById("ketqua").innerHTML = "Kết quả: " + kq;
        }
    </script>
</body>
</html>
